name: Bug report
description: Something in an ensforge package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues go through [private reporting](https://github.com/thenamespace/ensforge/security/advisories/new), not here.
        Redact private keys, API keys and RPC URLs with credentials.
  - type: dropdown
    id: packages
    attributes:
      label: Packages
      multiple: true
      options:
        - "@ensforge/sdk"
        - "@ensforge/react"
        - "@ensforge/hca"
        - "@ensforge/contracts"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ensforge, effect, viem and (if used) wagmi or react.
      placeholder: "@ensforge/sdk 1.0.0, effect 4.1.4, viem 2.57.20"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem, or a link to a repository. Include the chain and name.
      render: ts
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What you expected, what happened instead, and the error (`_tag`, `code` and message) if any.
    validations:
      required: true
