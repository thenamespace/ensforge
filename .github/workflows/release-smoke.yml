# Checks published versions against the archives a successful release verified and published:
# npm's integrity, the registry tarballs and their provenance from release.yml. Dispatch it with
# the IDs from the release's job summary once npm serves the versions; it never publishes.
name: Release smoke

on:
  workflow_dispatch:
    inputs:
      release-run-id:
        description: Run ID of a successful, published Release run
        type: number
        required: true
      pack-artifact-id:
        description: Packed artifact ID from that run's summary
        type: number
        required: true

permissions: {}

concurrency:
  group: release-smoke-${{ inputs.release-run-id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the release run, its jobs and its packed artifact
    steps:
      - name: Validate the release run and its packed artifact
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ inputs.release-run-id }}
          ARTIFACT_ID: ${{ inputs.pack-artifact-id }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'release-run-id must be a positive integer' >&2; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'pack-artifact-id must be a positive integer' >&2; exit 1; }

          run="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          jq -e --arg repo "$REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
            .path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and
            .conclusion == "success" and .head_branch == $branch and
            .head_repository.full_name == $repo' <<< "$run" > /dev/null ||
            { echo "run $RUN_ID is not a successful Release dispatch from $DEFAULT_BRANCH" >&2; exit 1; }
          # A dry run also succeeds and packs; only a run whose publish job succeeded published.
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[]' |
            jq -se 'any(.[]; .name == "publish" and .conclusion == "success")' > /dev/null ||
            { echo "run $RUN_ID did not publish" >&2; exit 1; }

          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" | jq -e --argjson run "$RUN_ID" '
            .workflow_run.id == $run and (.name | startswith("changeset-pack-")) and .expired == false' > /dev/null ||
            { echo "artifact $ARTIFACT_ID is not an unexpired changeset-pack artifact of run $RUN_ID" >&2; exit 1; }
          echo "sha=$(jq -r .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"

      # The released commit, so the smoke check runs the release's own tooling.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.pack-artifact-id }}
          run-id: ${{ inputs.release-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - run: pnpm release:smoke --pack-dir "$RUNNER_TEMP/release-candidate" --provenance
