# Fast lane: every pull request and push to main. Network-free and chain-free; the devnet,
# fuzz, services, fork and live suites run manually and in release CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint, typecheck (sources and tests), build, API reports, JSDoc, codegen,
      # dist types, OpenAPI snapshots and the fast test lanes.
      - run: pnpm check
        env:
          ENSFORGE_TEST_RUNS: "1000"
      - run: pnpm pack:check
