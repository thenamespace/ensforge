name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm pack:check
      - name: Test published package tarballs
        run: pnpm test:packages
      - name: Test minimum supported viem
        run: pnpm test:packages
        env:
          ENSFORGE_TEST_VIEM_VERSION: 2.49.0

  integration:
    name: Contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - name: Build integration dependencies
        run: pnpm --filter @ensforge/test-env... build
      - name: Select pinned ENS devnet image
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { ensContractsV2Commit } from './packages/test-env/dist/index.js';

          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase();
          console.log(`ENSFORGE_TEST_IMAGE=ghcr.io/${owner}/ensforge-devnet:${ensContractsV2Commit}`);
          NODE
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned ENS devnet image
        run: docker pull "$ENSFORGE_TEST_IMAGE"
      - name: Verify seeded ENS devnet
        run: pnpm test:integration
