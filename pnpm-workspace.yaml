packages:
  - "packages/*"
  - "tests/*"
  - "tools/*"

catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/cli": "3.0.3"
  "@commitlint/cli": "21.2.4"
  "@commitlint/config-conventional": "21.2.4"
  "@effect/atom-react": "4.1.4"
  "@effect/platform-node": "4.1.4"
  "@effect/tsgo": "0.70.0"
  "@effect/vitest": "4.1.4"
  "@ensdomains/address-encoder": "3.0.0"
  "@ensdomains/content-hash": "3.2.0"
  "@ensdomains/ensjs": "5.3.1"
  "@stryker-mutator/core": "10.1.1"
  "@stryker-mutator/vitest-runner": "10.1.1"
  "@testing-library/react": "16.3.3"
  "@types/node": "26.6.6"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  cborg: "7.0.0"
  effect: "4.1.4"
  fflate: "0.8.3"
  get-port: "7.2.0"
  jsdom: "31.0.1"
  klarity: "0.3.0"
  lefthook: "2.2.2"
  oxfmt: "0.78.0"
  oxlint: "1.93.0"
  prool: "0.2.18"
  publint: "0.3.25"
  react: "19.3.1"
  react-dom: "19.3.1"
  rolldown: "1.3.2"
  scheduler: "0.28.0"
  # Exact compilers of the ENS builds the devnet reproduces byte for byte.
  solc-0.8.25: "npm:solc@0.8.25"
  solc-0.8.27: "npm:solc@0.8.27"
  tslib: "2.9.1"
  turbo: "2.11.11"
  typescript: "7.0.2"
  viem: "2.57.20"
  vitest: "5.1.0"
  wagmi: "3.7.11"
  wagmi-v2: "npm:wagmi@2.19.5"

allowBuilds:
  bufferutil: true
  core-js: false
  es5-ext: true
  esbuild: true
  keccak: true
  lefthook: true
  msgpackr-extract: true
  utf-8-validate: true
  vue-demi: true

overrides:
  # prool pins tar 7.2.0, deprecated for known vulnerabilities.
  "prool>tar": "7.5.23"
  "tslib": "2.9.1"
  "tsx": "4.22.4"

minimumReleaseAgeExclude:
  - viem@2.56.0
  - "@effect/tsgo-darwin-arm64@0.70.0"
  - "@effect/tsgo-darwin-x64@0.70.0"
  - "@effect/tsgo-linux-arm64@0.70.0"
  - "@effect/tsgo-linux-arm@0.70.0"
  - "@effect/tsgo-linux-x64@0.70.0"
  - "@effect/tsgo-win32-arm64@0.70.0"
  - "@effect/tsgo-win32-x64@0.70.0"
  - "@effect/tsgo@0.70.0"
