  "@tanstack/react-router": "1.170.46"
  "@tanstack/react-start": "1.169.5"
  "@testing-library/react": "16.3.3"
  "@types/mdx": "2.0.14"
  "@types/node": "26.6.6"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vitejs/plugin-react": "6.3.0"
  cborg: "7.0.0"
  cn: "0.5.2"
  effect: "4.1.4"
  fflate: "0.8.3"
  fumadocs-core: "16.19.4"
  fumadocs-mdx: "15.6.3"
  fumadocs-ui: "npm:@fumadocs/base-ui@16.19.4"
  get-port: "7.2.0"
  jsdom: "31.0.1"
  klarity: "0.3.0"
  lefthook: "2.2.2"
  lucide-react: "1.74.0"
  nitro: "3.0.261103-rc"
  oxfmt: "0.78.0"
  oxlint: "1.93.0"
  oxlint-tsgolint: "7.0.2007"
  posthog-js: "1.450.0"
  posthog-node: "5.74.0"
  prool: "0.2.18"
  publint: "0.3.25"
  react: "19.3.1"
  react-dom: "19.3.1"
  rolldown: "1.3.2"
  scheduler: "0.28.0"
  shiki: "4.6.0"
  mermaid: "12.3.0"
  # Exact compilers of the ENS builds the devnet reproduces byte for byte.
  solc-0.8.25: "npm:solc@0.8.25"
  solc-0.8.27: "npm:solc@0.8.27"
  tailwindcss: "4.3.5"
  takumi-js: "2.20.0"
  tslib: "2.9.1"
  turbo: "2.11.11"
  typescript: "7.0.2"
  viem: "2.57.20"
  vite: "8.3.8"
  vitest: "5.1.0"
  wagmi: "3.7.11"
  wagmi-v2: "npm:wagmi@2.19.5"
  zod: "4.6.7"

allowBuilds:
  # Downloads the CLI binary that uploads the docs site's source maps (apps/docs).
  "@posthog/cli": true
  bufferutil: true
  core-js: false
  es5-ext: true
  esbuild: true
  keccak: true
  lefthook: true
  msgpackr-extract: true
  utf-8-validate: true
  vue-demi: true

overrides:
  # prool pins tar 7.2.0, deprecated for known vulnerabilities.
  "prool>tar": "7.5.23"
  # Dev-only advisories (commitlint and Stryker, @changesets/cli, solc's unused SMT solver
  # helper); drop each when its dependent updates.
  "fast-uri": "3.1.9"
  "launch-editor": "2.14.2"
  "@stryker-mutator/core>minimatch": "11.0.9"
  "typed-rest-client>qs": "6.17.1"
  "solc>tmp": "0.2.7"
  "tslib": "2.9.1"
  "tsx": "4.22.4"

minimumReleaseAgeExclude:
  - viem@2.56.0
  - "@effect/tsgo-darwin-arm64@0.70.0"
  - "@effect/tsgo-darwin-x64@0.70.0"
  - "@effect/tsgo-linux-arm64@0.70.0"
  - "@effect/tsgo-linux-arm@0.70.0"
  - "@effect/tsgo-linux-x64@0.70.0"
  - "@effect/tsgo-win32-arm64@0.70.0"
  - "@effect/tsgo-win32-x64@0.70.0"
  - "@effect/tsgo@0.70.0"
