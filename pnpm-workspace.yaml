  "@effect/vitest": "4.1.4"
  "@ensdomains/address-encoder": "3.0.0"
  "@ensdomains/content-hash": "3.2.0"
  "@ensdomains/ensjs": "5.3.1"
  "@fontsource-variable/inter": "5.3.0"
  "@fontsource-variable/jetbrains-mono": "5.3.0"
  "@fumadocs/changelog": "0.1.0"
  "@hugeicons/core-free-icons": "4.4.0"
  "@hugeicons/react": "1.1.10"
  "@posthog/rollup-plugin": "1.6.4"
  "@shikijs/magic-move": "4.6.0"
  "@shikijs/themes": "4.6.0"
  "@stryker-mutator/core": "10.1.1"
  "@stryker-mutator/vitest-runner": "10.1.1"
