packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@effect/atom-react": "4.0.0"
  "@effect/platform-node": "4.0.0"
  "@graphql-codegen/cli": "7.4.0"
  "@graphql-codegen/typed-document-node": "7.1.0"
  "@graphql-codegen/typescript-operations": "6.1.6"
  "@graphql-typed-document-node/core": "3.2.0"
  "@ensdomains/address-encoder": "1.1.4"
  "@ensdomains/content-hash": "3.1.1"
  "@effect/vitest": "4.0.0"
  "@testing-library/react": "16.3.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.3"
  cborg: "6.1.1"
  effect: "4.0.0"
  fflate: "0.8.3"
  graphql: "16.14.2"
  happy-dom: "20.12.0"
  react: "19.2.8"
  react-dom: "19.2.8"
  scheduler: "0.27.0"
  viem: "2.57.2"
  vite: "8.0.16"
  vitest: "5.0.3"
  wagmi: "3.7.7"

allowBuilds:
  bufferutil: true
  core-js: false
  es5-ext: true
  esbuild: true
  keccak: true
  lefthook: true
  msgpackr-extract: true
  utf-8-validate: true
  vue-demi: true

overrides:
  # Klarity's shared preset is compatible with Vitest 5; its published peers still target 4.
  "klarity>vitest": "5.0.3"
  "klarity>@vitest/coverage-v8": "5.0.3"
  "vitest>vite": "8.0.16"
  "@vitest/mocker>vite": "8.0.16"
  "@vitejs/plugin-react": "6.0.3"
  "@vitejs/plugin-rsc": "0.5.27"
  "tslib": "2.8.1"
  "tsx": "4.22.4"
  "vite@<6.4.3": "6.4.3"

minimumReleaseAgeExclude:
  - viem@2.56.0
  - happy-dom@20.12.0

patchedDependencies:
  "@rhinestone/sdk@1.8.0": packages/hca/patches/rhinestone-sdk-1.8.0.patch
  vocs@2.8.1: patches/vocs@2.8.1.patch
