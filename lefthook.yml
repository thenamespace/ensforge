# Git hooks (from klarity's monorepo preset, with the configs in .config/).
min_version: 2.1.0

pre-commit:
  jobs:
    - name: format
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,scss,md,mdx,yaml,yml}"
      # Generated by TanStack Router; oxfmt would reorder its imports on every build.
      # The generated API reference keeps its JSDoc examples verbatim (see .config/oxfmtignore).
      exclude:
        - "apps/docs/src/routeTree.gen.ts"
        - "apps/docs/content/docs/sdk/reference/actions/**"
        - "apps/docs/content/docs/sdk/reference/client.mdx"
        - "apps/docs/content/docs/sdk/reference/utilities.mdx"
        - "apps/docs/content/docs/sdk/reference/indexers.mdx"
        - "apps/docs/content/docs/sdk/reference/meta.json"
        - "apps/docs/content/docs/sdk/errors/**"
        - "apps/docs/content/docs/react/reference/**"
        - "apps/docs/content/docs/hca/reference/**"
        - "apps/docs/content/docs/contracts/reference/**"
      run: pnpm exec oxfmt -c .config/oxfmt.config.ts --write {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint -c .config/oxlint.config.ts --deny-warnings {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --config .config/commitlint.config.ts --edit {1}

pre-push:
  jobs:
    - name: check
      run: pnpm exec turbo --root-turbo-json .config/turbo.json run lint typecheck && pnpm test
